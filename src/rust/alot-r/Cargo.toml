[package]
name = "alot-r"
version = "0.0.0"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
name = "alot"
crate-type = ["rlib", "staticlib"]

# Regenerates R/extendr-wrappers.R; run by src/Makevars.
[[bin]]
name = "document"
path = "document.rs"

[dependencies]
alot-core = { path = "../alot-core" }
extendr-api = "0.9.0"
